name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          # 3.8 is not provided by setup-python on ubuntu-latest (24.04).
          - os: ubuntu-22.04
            python-version: '3.8'
    steps:
      - uses: actions/checkout@v6
      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - name: Configure poetry to use local environments
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - uses: actions/cache@v5
        name: Cache the virtual environment based on the lock file
        with:
          path: ./.venv
          key: venv-${{ matrix.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run pytest
        run: poetry run pytest
