[project]
name = "generate-systemd-timer"
version = "2.1.0"
description = "Generate a systemd unit.timer and unit.service pair"
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Thom Wiggers", email = "thom@thomwiggers.nl" },
]
dependencies = [
    "jinja2>=3,<4",
    "python-editor>=1.0,<2",
    "setuptools>=70.3,<76.0",
]

[project.urls]
Repository = "https://github.com/thomwiggers/systemd-timer-generator"

[project.scripts]
generate-systemd-timer = "systemd_generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["systemd_generator"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "docker: integration tests that build and run a Docker container (deselect with '-m \"not docker\"')",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
